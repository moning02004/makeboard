services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: makeboard
      POSTGRES_USER: makeboard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?.env에 POSTGRES_PASSWORD를 설정하세요}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U makeboard -d makeboard"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      MAKEBOARD_DATABASE_URL: postgresql+asyncpg://makeboard:${POSTGRES_PASSWORD}@db:5432/makeboard
      MAKEBOARD_ADMIN_TOKEN: ${MAKEBOARD_ADMIN_TOKEN:?.env에 MAKEBOARD_ADMIN_TOKEN을 설정하세요}
      MAKEBOARD_AGENT_TOKENS: ${MAKEBOARD_AGENT_TOKENS:-}
      MAKEBOARD_COOKIE_SECURE: ${MAKEBOARD_COOKIE_SECURE:-false}
    ports:
      # 운영에서는 앞단에 TLS 리버스 프록시(Traefik, nginx, Caddy)를 두고 127.0.0.1에만 여세요
      - "${MAKEBOARD_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 15s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
