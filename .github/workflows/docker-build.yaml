# GitHub Release를 발행하면 테스트를 돌린 뒤 Docker 이미지를 만들어 ghcr.io에 올린다.
# 태그: 릴리스 태그 이름(예: v1.0.0)과 latest (프리릴리스는 latest를 붙이지 않는다)
name: Release image

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements*.txt
      - run: pip install -r server/requirements-dev.txt
      - run: pytest
        working-directory: server

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ github.event.release.tag_name }}
            type=raw,value=latest,enable=${{ !github.event.release.prerelease }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          # 운영 서버(우분투 x86_64)용만 만든다. ARM용을 QEMU로 함께 만들면 빌드가 몇 배 느려진다.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
