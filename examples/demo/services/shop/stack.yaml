# 데모: docker compose 형식이지만 파일 이름이 compose.yaml 이 아니라 실제로 띄우지는 않습니다.
# 오른쪽 위 '구성'에서 서비스와 의존 관계를 볼 수 있습니다.
services:
  web:
    image: nginx:1.27
    ports:
      - "8080:80"
    depends_on:
      - api

  api:
    build: ./api
    image: shop-api:local
    depends_on:
      - db
      - cache

  db:
    image: postgres:16
    volumes:
      - pgdata:/var/lib/postgresql/data

  cache:
    image: redis:7

volumes:
  pgdata:
